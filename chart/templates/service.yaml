apiVersion: v1
kind: Service
metadata:
  name: {{ include "itl.common.fullname" . }}
  labels:
    {{- include "itl.common.labels" . | nindent 4 }}
  {{- if .Values.service.metrics.enabled }}
  annotations:
    {{- toYaml .Values.service.metrics.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "itl.common.selectorLabels" . | nindent 4 }}
